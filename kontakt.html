<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt – Tados WarChess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

<header class="site-header">
<a href="#main" class="skip-link">Zum Inhalt springen</a>


  <div class="container d-flex justify-content-between">
    <div class="main-nav">
      <a href="index.html"><img src="bilder/Symbolmarke.png" alt="Offizielle Logo des Unternehmens Tados" style="width: 40px;height: 39px; filter:invert(88%)"></a>
    </div>

    <nav class="main-nav">
      <a href="about-us.html">Über uns</a>
      <a href="barrierefreiheit.html">Barrierefreiheit</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="impressum.html">Impressum</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="urheberrecht.html">Urheberrecht</a>
    </nav>
  </div>
</header>
<main id="main" class="kontakt">
  <h1>Kontakt</h1>

  <p>
    Haben Sie Fragen zu unserem Projekt oder benötigen Sie weitere Informationen?
    Nutzen Sie gerne das folgende Kontaktformular.
  </p>

  <form class="contact-form" action="#" method="post" >
    
    <div class="form-group" style="margin-bottom: 30px">
      <label for="name" >Name:</label>
      <input type="text" id="name" name="name" required >
    </div>


    <div class="form-group" style="margin-bottom: 30px">
      <label for="email">E-Mail-Adresse:</label>
      <span id="email-error" class="error" aria-live="assertive"></span>

    <input type="email" id="email" name="email" required aria-describedby="email-error">


    


    </div>

    <div class="form-group">
      <label for="message">Nachricht:</label><br>
      <textarea id="message" name="message" rows="6" required ></textarea>
    </div>

    <fieldset class="form-group">
    

      <div class="checkbox-group">
        <input type="checkbox" id="privacy" name="privacy" required>
        <label for="privacy">
          Ich habe die <a href="datenschutz.html">Datenschutzerklärung</a> gelesen
          und stimme der Verarbeitung meiner Daten zu. 
        </label>
      </div>
    </fieldset>

    <button type="submit" class="action-btn" id="btn" style="width: 200px;" >
      Nachricht senden
    </button>
  </form>
  

 
</main>

<footer class="site-footer">
  <p>© 2026 Tado GmbH</p>
</footer>
<script>
document.querySelector(".contact-form").addEventListener("submit", function (e) {
  const email = document.getElementById("email");
  const error = document.getElementById("email-error");

  if (!email.checkValidity()) {
    e.preventDefault();
    error.textContent = "Bitte geben Sie eine gültige E-Mail-Adresse ein.";
    email.focus();
  } else {
    error.textContent = "";
  }
});
</script>
</body>
  

</html>
